# Exact boot-script and system fix (firmware-performance-and-bugs.md §7.9); same for 4.38.23429 and 4.38.23852. Off by default.

Harden SSH (key-only root login, per-device host keys):
  - Enabled: no
  - Category: "SSH (experimental)"
  - Experimental: yes
  - Description: |
      Kobo's SSH (enabled with .kobo/ssh-enabled) blanks root's password, allows empty passwords and uses host keys that are the same on every Kobo. With this: no password logins at all; root logs in only with a key from .kobo/ssh/authorized_keys; host keys are made on the device at the first start (ECDSA with the firmware's openssl) or taken from .kobo/ssh/ssh_host_*_key; sftp works (internal-sftp); LoginGraceTime 0 against CVE-2024-6387. Status in .kobo/ssh-status.txt. On this kernel sshd also needs 'Let sshd accept connections on kernel 2.6.35'. (firmware-performance-and-bugs.md §6)
      
      NEW: built from the Kobo Aura H2O analysis; not yet run on a device.
  - ReplaceText: {Find: "#!/bin/sh\n\nONBOARD_PARTITION=$1\nSSH_ENABLED_FILE=/mnt/onboard/.kobo/ssh-enabled\nSSH_DISABLED_FILE=/mnt/onboard/.kobo/ssh-disabled\nPASS_SET=/.login_pass_set\n\nif [ -e ${SSH_ENABLED_FILE} ]; then\n\techo \"Starting sshd\"\nelse\n\tif [ ! -e ${SSH_DISABLED_FILE} ]; then\n\t\ttouch ${SSH_DISABLED_FILE}\n\t\techo \"To enable ssh:\" >> ${SSH_DISABLED_FILE}\n\t\techo \"- Rename this file to ssh-enabled\" >> ${SSH_DISABLED_FILE}\n\t\techo \"- Reboot the device\" >> ${SSH_DISABLED_FILE}\n\t\techo \"- Connect via: ssh root@<device_ip>\" >> ${SSH_DISABLED_FILE}\n\tfi\n\tif [ -f ${PASS_SET} ]; then\n\t\trm ${PASS_SET}\n\tfi\n\techo \"NOT starting sshd (disabled)\"\n\texit 0\nfi\n\nif [ ! -d /var/empty ]; then\n\tmkdir -p /var/empty\n\tchmod 755 /var/empty                                                                                                     \nfi                                                             \n[ ! -d /dev/pts ] && mkdir -p /dev/pts\n/bin/mount -t devpts none /dev/pts -o mode=0622          \nif ! grep '^sshd:' /etc/group > /dev/null 2>&1; then\n\taddgroup --gid 999 sshd                                      \nfi\n\nROOT_PASS_EXISTS=`grep '^root:' /etc/passwd | awk -F: '{print $2}'`\nif [ ! -f \"${PASS_SET}\" ] && [ ! -z \"${ROOT_PASS_EXISTS}\" ]; then\n\tpasswd -d root >/dev/null 2>&1\nfi\n\n/usr/sbin/sshd\n", Replace: "#!/bin/sh\n# /etc/init.d/ssh, hardened (kobo_aura_h2o firmware-performance-and-bugs.md §7.9):\n# - no \"passwd -d root\": root logs in with a key only (see sshd_config)\n# - per-device host keys in /etc/ssh/device; the keys shared by every Kobo in /etc/ssh are never used\n# - started in the background, so key generation never delays the boot\n\nSSH_ENABLED_FILE=/mnt/onboard/.kobo/ssh-enabled\nSSH_DISABLED_FILE=/mnt/onboard/.kobo/ssh-disabled\nSSH_USER_DIR=/mnt/onboard/.kobo/ssh\nSSH_STATUS=/mnt/onboard/.kobo/ssh-status.txt\nKEY_DIR=/etc/ssh/device\n\nif [ ! -e ${SSH_ENABLED_FILE} ]; then\n\tif [ ! -e ${SSH_DISABLED_FILE} ]; then\n\t\t{\n\t\t\techo \"To enable ssh:\"\n\t\t\techo \"- Put your public key into .kobo/ssh/authorized_keys\"\n\t\t\techo \"- Rename this file to ssh-enabled\"\n\t\t\techo \"- Reboot the device\"\n\t\t\techo \"- Connect via: ssh root@<device_ip> (key login only)\"\n\t\t} > ${SSH_DISABLED_FILE}\n\tfi\n\techo \"NOT starting sshd (disabled)\"\n\texit 0\nfi\n\necho \"Starting sshd\"\nif [ ! -d /var/empty ]; then\n\tmkdir -p /var/empty\n\tchmod 755 /var/empty\nfi\n[ ! -d /dev/pts ] && mkdir -p /dev/pts\n/bin/mount -t devpts none /dev/pts -o mode=0622\nif ! grep '^sshd:' /etc/group > /dev/null 2>&1; then\n\taddgroup --gid 999 sshd\nfi\n\nhave_host_key() {\n\tfor t in ed25519 ecdsa rsa; do\n\t\t[ -s ${KEY_DIR}/ssh_host_${t}_key ] && return 0\n\tdone\n\treturn 1\n}\n\n# Host keys made on a PC (ssh-keygen -t ed25519 -N '' -f ssh_host_ed25519_key) and copied\n# to .kobo/ssh/ are moved into place; the copy on the user partition is deleted.\ninstall_user_host_keys() {\n\tfor t in ed25519 ecdsa rsa; do\n\t\tf=ssh_host_${t}_key\n\t\t[ -s ${SSH_USER_DIR}/$f ] || continue\n\t\tcp ${SSH_USER_DIR}/$f ${KEY_DIR}/$f.tmp && chmod 600 ${KEY_DIR}/$f.tmp && mv ${KEY_DIR}/$f.tmp ${KEY_DIR}/$f && rm -f ${SSH_USER_DIR}/$f ${SSH_USER_DIR}/$f.pub\n\tdone\n}\n\ngenerate_host_keys() {\n\t# kernel 2.6.35 has no getrandom(): wait (at most 120 s) for the entropy pool\n\tn=0\n\twhile [ \"$(cat /proc/sys/kernel/random/entropy_avail 2>/dev/null || echo 0)\" -lt 256 ] && [ $n -lt 120 ]; do\n\t\tsleep 1\n\t\tn=$((n + 1))\n\tdone\n\t# mix in device-unique (not secret) data, so two devices never start from the same pool state\n\tcat /sys/block/mmcblk0/device/cid /sys/block/mmcblk0/device/serial /proc/interrupts /proc/stat /proc/uptime > /dev/urandom 2>/dev/null\n\tif command -v ssh-keygen > /dev/null 2>&1; then\n\t\tssh-keygen -q -t ed25519 -N '' -f ${KEY_DIR}/ssh_host_ed25519_key.tmp && mv ${KEY_DIR}/ssh_host_ed25519_key.tmp ${KEY_DIR}/ssh_host_ed25519_key\n\t\trm -f ${KEY_DIR}/ssh_host_ed25519_key.tmp ${KEY_DIR}/ssh_host_ed25519_key.tmp.pub\n\telse\n\t\t# the firmware's openssl 1.0.1j can't make ed25519 keys; sshd reads this PEM ECDSA P-256 key\n\t\tRANDFILE=/tmp/.rnd /usr/bin/openssl ecparam -name prime256v1 -genkey -noout -out ${KEY_DIR}/ssh_host_ecdsa_key.tmp && mv ${KEY_DIR}/ssh_host_ecdsa_key.tmp ${KEY_DIR}/ssh_host_ecdsa_key\n\t\trm -f ${KEY_DIR}/ssh_host_ecdsa_key.tmp /tmp/.rnd\n\tfi\n}\n\n(\n\tumask 077\n\tmkdir -p ${KEY_DIR}\n\tchmod 700 ${KEY_DIR}\n\tinstall_user_host_keys\n\thave_host_key || generate_host_keys\n\tif ! have_host_key; then\n\t\techo \"$(date): no host key could be made; sshd not started\" > ${SSH_STATUS}\n\t\texit 1\n\tfi\n\tif [ ! -s ${SSH_USER_DIR}/authorized_keys ] && [ ! -s /.ssh/authorized_keys ]; then\n\t\techo \"$(date): warning: no authorized_keys, nobody can log in\" > ${SSH_STATUS}\n\tfi\n\tif /usr/sbin/sshd; then\n\t\techo \"$(date): sshd started\" >> ${SSH_STATUS}\n\telse\n\t\techo \"$(date): sshd failed to start (exit $?)\" >> ${SSH_STATUS}\n\tfi\n) &\n"}
