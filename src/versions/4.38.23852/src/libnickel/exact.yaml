# Exact patches for libnickel.so.1.0.0, valid for both 4.38.23429 and 4.38.23852
# (same Sym+Rel and the same bytes in both builds; see firmware-performance-and-bugs.md §7.9). All off by default.

Integrity check when a WAL file exists (B1):
  - Enabled: no
  - PatchGroup: DB integrity check (B1)
  - Category: "Bug fixes (experimental)"
  - Experimental: yes
  - NotRecommended: "the database check would then run at every start and after every USB session (an estimated 10-30 s each with a large library). Check the database on a computer instead (firmware-performance-and-bugs.md section 4.4)."
  - Description: |
      DatabaseAdapter::getIntegrityCheckResult(force=false) only runs "pragma integrity_check(1)" when
      <db>.sqlite-journal exists, which never happens in WAL mode. This makes it test <db>.sqlite-wal
      instead: the format string becomes "%1.sqlite-wal" and the length passed to
      QString::fromLatin1_helper goes from 17 to 13. While nickel has the WAL database open the -wal
      file practically always exists, so the check then runs on every CheckDatabaseCommand.
      Cost: a full read of KoboReader.sqlite (an estimated 10-30 s for 70 MB on this device).
  - BaseAddress: {Sym: _ZN15DatabaseAdapter23getIntegrityCheckResultEbRK7QString, Rel: 0x8}
  - ReplaceBytes: {FindH: 88 46 11 21 F8 60, ReplaceH: 88 46 0D 21 F8 60}   # mov r8,r1; movs r1,#17 -> #13; str r0,[r7,#12]
  - FindReplaceString: {Find: "%1.sqlite-journal", Replace: "%1.sqlite-wal"}

Always run the integrity check (B1, branch variant):
  - Enabled: no
  - PatchGroup: DB integrity check (B1)
  - Category: "Bug fixes (experimental)"
  - Experimental: yes
  - NotRecommended: "the database check would then run at every start and after every USB session (an estimated 10-30 s each with a large library). Check the database on a computer instead (firmware-performance-and-bugs.md section 4.4)."
  - Description: |
      Same effect as the WAL variant, with one 4-byte change: the "if (!force) check -journal exists"
