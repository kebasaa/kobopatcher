# Exact patch for usr/local/Kobo/nickel, valid for both 4.38.23429 and 4.38.23852. Off by default.

Drop /chroot entries from nickel RPATH:
  - Enabled: no
  - Category: "Performance (experimental)"
  - Experimental: yes
  - NotRecommended: "it works, but gains nothing measurable (glibc skips the missing folder after the first look)."
  - Description: |
      nickel's DT_RPATH is "/chroot/lib:/chroot/usr/lib:/usr/local/Qt-5.2.1-arm/lib"; /chroot does not
      exist on the device. This shortens it to "/usr/local/Qt-5.2.1-arm/lib" (NUL-terminated in place,
      same file size). No library is found anywhere else as a result. The gain is close to zero: glibc
      marks a missing RPATH directory as nonexistent after its first miss, and libnickel, librmsdk and
      libxslt carry the same /chroot entries anyway.
  - FindReplaceString: {Find: "/chroot/lib:/chroot/usr/lib:/usr/local/Qt-5.2.1-arm/lib", Replace: "/usr/local/Qt-5.2.1-arm/lib"}
