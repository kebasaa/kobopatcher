# Patches for usr/local/Kobo/platforms/libkobo.so (Qt QPA "kobo" plugin, KoboScreenNXP).
# Byte-identical in 4.38.23429 and 4.38.23852 (sha256 76136b47bb999efa...); vaddr == file offset.

E-ink - full refresh only above 95% of the screen:
  - Enabled: no
  - Category: "E-ink (experimental)"
  - Experimental: yes
  - Description: |
      KoboScreenNXP::updateModeFromQt makes an update FULL (redraw every pixel, flashes with GC16) when it covers more than 85% of the screen and Nickel asked for neither PARTIAL nor FULL. This raises the limit to 95%: large dialogs and near-full redraws become PARTIAL (fewer flashes, a little more ghosting). Whole-screen updates stay FULL. File 0x15150 in both 4.38.23429 and 4.38.23852. Not yet run on a device.
  - BaseAddress: {Sym: _ZN13KoboScreenNXP16updateModeFromQtERK5QRectS2_j, Rel: 0x98}
  - ReplaceFloat: {Offset: 0, Find: 0.85, Replace: 0.95}

E-ink - retry a failed screen update after 20 ms instead of 300 ms:
  - Enabled: no
  - Category: "E-ink (experimental)"
  - Experimental: yes
  - Description: |
      When the MXCFB_SEND_UPDATE ioctl fails, KoboScreenNXP::blit sleeps 300 ms on the GUI thread before keeping the area for the next redraw. This shortens the sleep to 20 ms. Rare path; low risk. File 0x16f9e in both builds. Not yet run on a device.
  - BaseAddress: {Sym: _ZN13KoboScreenNXP4blitERK7QRegion, Rel: 0x7ca}
  - ReplaceBytes: {FindH: 49 F2 E0 30 C0 F2 04 00, ReplaceH: 44 F6 20 60 C0 F2 00 00}

E-ink - wait for completion only on explicit FULL updates (HIGH RISK):
  - Enabled: no
  - Category: "E-ink (experimental)"
  - Experimental: yes
  - NotRecommended: "high risk of screen artefacts and of a half-drawn sleep screen."
  - PatchGroup: libkobo update wait
  - Description: |
      KoboScreenNXP::blit waits (MXCFB_WAIT_FOR_UPDATE_COMPLETE, on the GUI thread) for every update that Nickel did not mark with Qt flag 0x800000. With this it waits only for updates Nickel explicitly requests as FULL (Qt flag 0x8); everything else returns at once and relies on the kernel's QUEUE_AND_MERGE scheme. Faster response; risk of artefacts and of a half-drawn sleep screen. File 0x1698c in both builds. Not yet run on a device.
  - BaseAddress: {Sym: _ZN13KoboScreenNXP4blitERK7QRegion, Rel: 0x1b8}
  - ReplaceBytes: {FindH: 22 02 40 F1 BA 81, ReplaceH: 22 07 00 F1 BA 81}

E-ink - never wait for update completion (VERY HIGH RISK):
  - Enabled: no
  - Category: "E-ink (experimental)"
  - Experimental: yes
  - NotRecommended: "very high risk of screen artefacts and of incomplete sleep screens."
  - PatchGroup: libkobo update wait
  - Description: |
      KoboScreenNXP::blit never waits for the panel to finish an update. Maximum responsiveness; highest risk of artefacts and of incomplete sleep screens. File 0x1698e in both builds. Not yet run on a device.
  - BaseAddress: {Sym: _ZN13KoboScreenNXP4blitERK7QRegion, Rel: 0x1ba}
  - ReplaceBytes: {FindH: 40 F1 BA 81, ReplaceH: 00 BF 00 BF}

E-ink - use GL16 wherever GC16 is requested (HIGH RISK, not recommended):
  - Enabled: no
  - Category: "E-ink (experimental)"
  - Experimental: yes
  - NotRecommended: "it also removes the reader's deliberate anti-ghosting refreshes, because libkobo cannot tell menus from book pages."
  - Description: |
      Maps waveform 2 (GC16) to 5 (GL16) for every update with Qt flag 0x40 in the V1 blit. libkobo cannot tell UI from reading updates, so this also removes the deliberate anti-ghosting refreshes in the reader. File 0x16cb6 in both builds. Not yet run on a device.
  - BaseAddress: {Sym: _ZN13KoboScreenNXP4blitERK7QRegion, Rel: 0x4de}
  - ReplaceBytes: {FindH: 61 06 48 BF 02 25, ReplaceH: 61 06 48 BF 05 25}
