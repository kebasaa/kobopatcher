# Patch for etc/init.d/rcS (4.38.23429 and 4.38.23852: the line is identical, line 184).

Do not count boots for the factory-reset screen:
  - Enabled: no
  - Category: "Boot (experimental)"
  - Experimental: yes
  - NotRecommended: "it switches off Kobo's boot-loop recovery, the safety net when a patch stops the Kobo from starting. The MBR write it removes is harmless."
  - Description: |
      rcS runs 'pickel should-factory-reset' at every start; it rewrites the MBR (boot counter) and, after 5 starts in a row that never reach nickel, shows the factory-reset screen. This removes the call, so pickel no longer writes the MBR, and the boot-loop recovery is off. Nickel still rewrites the MBR once per start. Don't use it while you test other patches: the recovery is your safety net. Not yet run on a device.
  - ReplaceText: {Find: "/usr/local/Kobo/pickel should-factory-reset\n", Replace: "true # pickel should-factory-reset disabled by patch\n"}
