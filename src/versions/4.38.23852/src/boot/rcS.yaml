# kobopatcher patch set for Kobo firmware 4.38.23852. Generated by tools/make_patchset.py;
# choose patches with kobopatcher --select instead of editing Enabled here.

Skip the disk check after a clean shutdown:
  - Enabled: no
  - Category: "Boot (experimental)"
  - Experimental: yes
  - Description: |
      The user partition is checked with dosfsck up to four times at every start. With this, the shutdown script leaves a marker after its own check, and the next start skips the check when the marker is there; crashes, watchdog reboots and power loss leave none, so those starts still check. Measure first with 'time dosfsck -n /dev/mmcblk0p3' on the device; if it takes well under a second, it isn't worth it. (firmware-performance-and-bugs.md S4)
      
      NEW: built from the Kobo Aura H2O analysis; not yet run on a device.
  - ReplaceText: {Find: "dosfsck -a -w $ONBOARD_PARTITION || dosfsck -a -w $ONBOARD_PARTITION || dosfsck -a -w $ONBOARD_PARTITION || dosfsck -a -w $ONBOARD_PARTITION || FS_CORRUPT=1\n", Replace: "if [ -e /etc/.onboard_clean ]; then rm -f /etc/.onboard_clean; else dosfsck -a -w $ONBOARD_PARTITION || dosfsck -a -w $ONBOARD_PARTITION || dosfsck -a -w $ONBOARD_PARTITION || dosfsck -a -w $ONBOARD_PARTITION || FS_CORRUPT=1; fi\n"}

Read the Qt libraries ahead in the background:
  - Enabled: no
  - Category: "Boot (experimental)"
  - Experimental: yes
  - Description: |
      rcS reads all Qt libraries (about 58 MB) into the cache before the boot animation starts. This lets it run in the background while the start continues. (firmware-performance-and-bugs.md S5)
      
      NEW: built from the Kobo Aura H2O analysis; not yet run on a device.
  - ReplaceText: {Find: "find /usr/local/Trolltech/QtEmbedded-4.6.2-arm/lib/ -type f -exec readahead {} \\;\n", Replace: "find /usr/local/Trolltech/QtEmbedded-4.6.2-arm/lib/ -type f -exec readahead {} \\; &\n"}

Set the clock before nickel starts:
  - Enabled: no
  - Category: "Boot (experimental)"
  - Experimental: yes
  - Description: |
      The clock is read from the hardware clock in a background job, so nickel can start with a wrong date. This sets it just before nickel starts (it takes milliseconds). (firmware-performance-and-bugs.md S6)
      
      NEW: built from the Kobo Aura H2O analysis; not yet run on a device.
  - ReplaceText: {Find: "\n\t/sbin/hwclock -s -u\n) &\n", Replace: "\n) &\n"}
  - ReplaceText: {Find: "/usr/local/Kobo/hindenburg &\n", Replace: "/sbin/hwclock -s -u\n/usr/local/Kobo/hindenburg &\n"}

Let the CPU speed adapt to the load:
  - Enabled: no
  - Category: "Boot (experimental)"
  - Experimental: yes
  - Description: |
      The CPU frequency is never managed on this device. 20 seconds after nickel starts, this switches to the 'conservative' governor (down 20 %, up 60 %), if the kernel has it. Battery use may change. (firmware-performance-and-bugs.md §4.1, S7)
      
      NEW: built from the Kobo Aura H2O analysis; not yet run on a device.
  - ReplaceText: {Find: "LIBC_FATAL_STDERR_=1 /usr/local/Kobo/nickel -platform kobo -skipFontLoad &\n", Replace: "LIBC_FATAL_STDERR_=1 /usr/local/Kobo/nickel -platform kobo -skipFontLoad &\n( sleep 20; CF=/sys/devices/system/cpu/cpu0/cpufreq; if grep -q conservative $CF/scaling_available_governors 2>/dev/null; then echo conservative > $CF/scaling_governor; echo 20 > $CF/conservative/down_threshold 2>/dev/null; echo 60 > $CF/conservative/up_threshold 2>/dev/null; fi ) &\n"}

Use the deadline I/O scheduler:
  - Enabled: no
  - Category: "Boot (experimental)"
  - Experimental: yes
  - Description: |
      Switches the internal storage from the CFQ to the deadline I/O scheduler at start. (firmware-performance-and-bugs.md §4.5)
      
      NEW: built from the Kobo Aura H2O analysis; not yet run on a device.
  - ReplaceText: {Find: "FORCE_FACTORY_RESET=0\n", Replace: "echo deadline > /sys/block/mmcblk0/queue/scheduler 2>/dev/null\nFORCE_FACTORY_RESET=0\n"}

Fewer device events at start (measure first):
  - Enabled: no
  - Category: "Boot (experimental)"
  - Experimental: yes
  - Description: |
      Replaces the full 'udevadm trigger' that runs alongside nickel's start with one limited to input, block, power_supply and usb devices. Medium risk: nickel may rely on other events; check USB, SD cards, battery and charging icons afterwards. Only worth it if measured. (firmware-performance-and-bugs.md S8)
      
      NEW: built from the Kobo Aura H2O analysis; not yet run on a device.
  - ReplaceText: {Find: "[ $PLATFORM != freescale ] && rm -rf /dev/mmcblk1* && udevadm trigger &\n", Replace: "[ $PLATFORM != freescale ] && rm -rf /dev/mmcblk1* && udevadm trigger --subsystem-match=input --subsystem-match=block --subsystem-match=power_supply --subsystem-match=usb &\n"}
