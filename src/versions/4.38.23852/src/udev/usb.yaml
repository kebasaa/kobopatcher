Safer SD card and USB-eject handling:
  - Enabled: no
  - Category: "Fixes (experimental)"
  - Experimental: yes
  - Description: |
      SD cards are no longer 'repaired' with dosfsck -a at every insert (they are mounted read-only anyway); exFAT/NTFS cards, which this kernel can't read, now give nickel's 'SD mount failed' message instead of nothing. After a USB session, a user partition that fails dosfsck four times is mounted read-only instead of rebooting silently (a reboot remains the fallback if even that fails). (firmware-performance-and-bugs.md B12)
      
      NEW: built from the Kobo Aura H2O analysis; not yet run on a device.
  - ReplaceText: {Find: "\t\tif [ $FS_CORRUPT == 1 ]; then\n\t\t\techo \"Corruption detected on $PARTITION - rebooting...\"\n\t\t\treboot\n\t\tfi\n\t\tmount -o $MOUNTARGS -t vfat $PARTITION /mnt/onboard\n", Replace: "\t\tif [ $FS_CORRUPT == 1 ]; then\n\t\t\t# B12: no silent reboot. Mount read-only so nickel keeps running and the user\n\t\t\t# can reconnect USB to back up and repair; the next start checks again\n\t\t\techo \"Corruption detected on $PARTITION - mounting read-only\"\n\t\t\tlogger -t udev-usb \"dosfsck failed 4 times on $PARTITION, mounted read-only\" 2>/dev/null\n\t\t\tmount -r -o $MOUNTARGS -t vfat $PARTITION /mnt/onboard || reboot\n\t\telse\n\t\t\tmount -o $MOUNTARGS -t vfat $PARTITION /mnt/onboard\n\t\tfi\n", Count: 2}
  - ReplaceText: {Find: "\t\tif [ -e $SD ]; then\n", Replace: "\t\tif [ -n \"$SD\" ] && [ -e \"$SD\" ]; then\n"}

