# Patches for usr/local/Kobo/pickel-imx. Byte-identical in 4.38.23429 and 4.38.23852.
# WARNING: if pickel-imx fails, rcS boots into recovery (factory reset). Prefer the rcS patch.

Factory-reset counter - never write the MBR (HIGH RISK):
  - Enabled: no
  - Category: "Boot (experimental)"
  - Experimental: yes
  - NotRecommended: "it switches off Kobo's boot-loop recovery, and a mistake in pickel-imx leads to a factory reset. The MBR write it removes is harmless."
  - PatchGroup: pickel factory-reset counter
  - Description: |
      'pickel should-factory-reset' counts boots in MBR bytes 0x133-0x137; nickel resets the count each time it starts, and after 5 boots without nickel the factory-reset screen appears. This skips pickel's MBR write, which turns that boot-loop recovery off. Nickel still writes the MBR once per boot. A mistake in this binary leads to a factory reset; the rcS patch does the same more safely. File 0x12a0 in both builds. Not yet run on a device.
  - BaseAddress: 0x12a0
  - ReplaceBytes: {FindH: FF F7 A0 EE, ReplaceH: 06 E0 00 BF}

Factory-reset counter - use only the 4 real table entries (cosmetic, HIGH RISK):
  - Enabled: no
  - Category: "Boot (experimental)"
  - Experimental: yes
  - NotRecommended: "no practical benefit (the over-read is harmless), and a mistake in pickel-imx leads to a factory reset."
  - PatchGroup: pickel factory-reset counter
  - Description: |
      Stops the counter from reading one entry past its 4-entry table (it reads the bytes "PLAT" there, deterministically and harmlessly). The factory-reset screen then appears after 4 boots without nickel instead of 5. No practical benefit. File 0x1276 in both builds. Not yet run on a device.
  - BaseAddress: 0x1276
  - ReplaceBytes: {FindH: 04 2B 22 D0, ReplaceH: 03 2B 22 D0}
