# Exact boot-script and system fix (firmware-performance-and-bugs.md §7.9); same for 4.38.23429 and 4.38.23852. Off by default.

Let sshd accept connections on kernel 2.6.35:
  - Enabled: no
  - Category: "SSH (experimental)"
  - Experimental: yes
  - Description: |
      The bundled sshd starts on kernel 2.6.35, but every login dies in its pre-authentication sandbox: setrlimit() uses prlimit64, which this kernel (2.6.35, the syscall came in 2.6.36) doesn't have, and the sandbox treats the failure as fatal. This makes the three setrlimit failures non-fatal, so the pre-authentication process runs without the rlimit/seccomp sandbox (seccomp doesn't exist on this kernel anyway). Use SSH only on a trusted network. (firmware-performance-and-bugs.md §7.9)
      
      NEW: built from the Kobo Aura H2O analysis; not yet run on a device.
