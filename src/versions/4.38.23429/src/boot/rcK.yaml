# rcK half of S4, hardened (firmware-performance-and-bugs.md §7.9): replaces the rcK.yaml of the kobopatcher set.

Skip the disk check after a clean shutdown:
  - Enabled: no
  - Category: "Boot (experimental)"
  - Experimental: yes
  - Description: |
      The user partition is checked with dosfsck up to four times at every start. With this, the shutdown script checks the unmounted (or read-only) user partition itself and leaves a marker only if that check succeeded; the next start skips its check when the marker is there. Crashes, watchdog reboots, power loss and a failed or impossible shutdown check leave none, so those starts still check. /etc/.onboard_rck_status tells what the last shutdown did (clean, fsck-failed, busy). Measure first with 'time dosfsck -n /dev/mmcblk0p3' on the device; if it takes well under a second, it isn't worth it. (firmware-performance-and-bugs.md S4, §7.9)
      
      NEW: built from the Kobo Aura H2O analysis; not yet run on a device.
  - ReplaceText: {Find: "umount -a -r\ndosfsck -a -w $(onboard_partition $PLATFORM)\n", Replace: "# S4 (hardened): write the clean marker only after this shutdown's own check of the\n# unmounted (or read-only) user partition succeeded; otherwise the next start checks\nONBOARD_PARTITION=$(onboard_partition $PLATFORM)\nONBOARD_CLEAN=0\nif umount /mnt/onboard 2>/dev/null || mount -o remount,ro /mnt/onboard 2>/dev/null; then\n\tif dosfsck -a -w $ONBOARD_PARTITION || dosfsck -a -w $ONBOARD_PARTITION; then\n\t\tONBOARD_CLEAN=1\n\t\techo clean > /etc/.onboard_rck_status\n\telse\n\t\techo fsck-failed > /etc/.onboard_rck_status\n\tfi\nelse\n\techo busy > /etc/.onboard_rck_status\nfi\n[ $ONBOARD_CLEAN == 1 ] && touch /etc/.onboard_clean\nsync\numount -a -r\n[ $ONBOARD_CLEAN == 1 ] || dosfsck -a -w $ONBOARD_PARTITION\n"}
