# Exact boot-script and system fix (firmware-performance-and-bugs.md §7.9); same for 4.38.23429 and 4.38.23852. Off by default.

Bound the writes to nickel's hardware-status pipe:
  - Enabled: no
  - Category: "Fixes (experimental)"
  - Experimental: yes
  - Description: |
      The udev scripts and ntpd.sh write events into a pipe that only nickel reads; while nickel isn't reading, every write waited forever in the background. Each write now gives up after 300 s (long enough for nickel's start). (firmware-performance-and-bugs.md B11)
      
      NEW: built from the Kobo Aura H2O analysis; not yet run on a device.
  - ReplaceText: {Find: "#!/bin/sh\n", Replace: "#!/bin/sh\n\n# B11: bounded write to nickel's FIFO; gives up after 300 s if nothing reads it\nhwstatus() {\n\t/usr/bin/timeout 300 /bin/sh -c 'echo \"$1\" >> /tmp/nickel-hardware-status' hwstatus \"$*\"\n}\n"}
  - ReplaceText: {Find: "\t\techo sd $ACTION $DEVNAME >> /tmp/nickel-hardware-status\n", Replace: "\t\thwstatus sd $ACTION $DEVNAME\n"}
  - ReplaceText: {Find: "\t\t\techo sd mount fail $DEVNAME >> /tmp/nickel-hardware-status &\n", Replace: "\t\t\thwstatus sd mount fail $DEVNAME &\n"}
  - ReplaceText: {Find: "else\n\t\t\techo sd $ACTION $DEVNAME >> /tmp/nickel-hardware-status &\n", Replace: "else\n\t\t\thwstatus sd $ACTION $DEVNAME &\n"}
  - ReplaceText: {Find: "then\n\techo sd $ACTION $DEVNAME >> /tmp/nickel-hardware-status &\n", Replace: "then\n\thwstatus sd $ACTION $DEVNAME &\n"}

Safer SD card and USB-eject handling:
  - Enabled: no
  - Category: "Fixes (experimental)"
  - Experimental: yes
  - Description: |
      SD cards are no longer 'repaired' with dosfsck -a at every insert (they are mounted read-only anyway); exFAT/NTFS cards, which this kernel can't read, now give nickel's 'SD mount failed' message instead of nothing. After a USB session, a user partition that fails dosfsck four times is mounted read-only instead of rebooting silently (a reboot remains the fallback if even that fails). (firmware-performance-and-bugs.md B12)
      
      NEW: built from the Kobo Aura H2O analysis; not yet run on a device.
  - ReplaceText: {Find: "\tif [ $ACTION == remove ]; then\n", Replace: "\tif [ \"$ACTION\" == remove ]; then\n"}
  - ReplaceText: {Find: "if [ $ACTION == add ]; then\n", Replace: "if [ \"$ACTION\" == add ]; then\n\t# B12: kernel 2.6.35 has no exFAT/NTFS driver; tell nickel instead of ignoring the card\n\tblkid $DEVNAME | grep -v EFI | grep -q -e 'TYPE=\"exfat\"' -e 'TYPE=\"ntfs\"' && /usr/bin/timeout 300 /bin/sh -c 'echo \"sd mount fail $1\" >> /tmp/nickel-hardware-status' sd $DEVNAME &\n"}
  - ReplaceText: {Find: "\t\tdosfsck -a -w $DEVNAME\n", Replace: "\t\t# B12: no automatic repair of the user's card; it is mounted read-only anyway\n"}
