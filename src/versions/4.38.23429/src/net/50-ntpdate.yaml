# kobopatcher patch set for Kobo firmware 4.38.23429. Generated by tools/make_patchset.py;
# choose patches with kobopatcher --select instead of editing Enabled here.

# Exact boot-script and system fix (firmware-performance-and-bugs.md §7.9); same for 4.38.23429 and 4.38.23852. Off by default.

Use the NTP server from DHCP:
  - Enabled: no
  - Category: "Fixes (experimental)"
  - Experimental: yes
  - Description: |
      The time is synced only from pool.ntp.org, so on a network without internet access the clock stays wrong and TLS fails. This uses the NTP servers the DHCP server announces (if any), else pool.ntp.org, and runs one ntpd at a time. (firmware-performance-and-bugs.md B13)
      
      NEW: built from the Kobo Aura H2O analysis; not yet run on a device.
  - ReplaceText: {Find: "case \"${reason}\" in\n\tBOUND|REBIND|REBOOT|RENEW|TIMEOUT|STATIC)\n\t\tntpd -N -q -p 0.pool.ntp.org -p 1.pool.ntp.org -p 2.pool.ntp.org -p 3.pool.ntp.org -S /usr/local/Kobo/ntpd.sh &\n\t\t;;\n", Replace: "case \"${reason}\" in\n\tBOUND|REBIND|REBOOT|RENEW|TIMEOUT|STATIC)\n\t\t# B13: prefer the NTP servers from DHCP option 42 (dhcpcd exports new_ntp_servers;\n\t\t# /etc/dhcpcd.conf requests it with \"option ntp_servers\"); pool.ntp.org otherwise\n\t\tntp_peers=\n\t\tfor ntp_server in ${new_ntp_servers}; do\n\t\t\tntp_peers=\"${ntp_peers} -p ${ntp_server}\"\n\t\tdone\n\t\t[ -z \"${ntp_peers}\" ] && ntp_peers=\"-p 0.pool.ntp.org -p 1.pool.ntp.org -p 2.pool.ntp.org -p 3.pool.ntp.org\"\n\t\t# one one-shot ntpd at a time (each renewal used to start another)\n\t\tkillall -q ntpd 2>/dev/null\n\t\tntpd -N -q ${ntp_peers} -S /usr/local/Kobo/ntpd.sh &\n\t\t;;\n"}
