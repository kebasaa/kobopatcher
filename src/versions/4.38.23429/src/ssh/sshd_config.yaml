# kobopatcher patch set for Kobo firmware 4.38.23429. Generated by tools/make_patchset.py;
# choose patches with kobopatcher --select instead of editing Enabled here.

# Exact boot-script and system fix (firmware-performance-and-bugs.md §7.9); same for 4.38.23429 and 4.38.23852. Off by default.

Harden SSH (key-only root login, per-device host keys):
  - Enabled: no
  - Category: "SSH (experimental)"
  - Experimental: yes
  - Description: |
      Kobo's SSH (enabled with .kobo/ssh-enabled) blanks root's password, allows empty passwords and uses host keys that are the same on every Kobo. With this: no password logins at all; root logs in only with a key from .kobo/ssh/authorized_keys; host keys are made on the device at the first start (ECDSA with the firmware's openssl) or taken from .kobo/ssh/ssh_host_*_key; sftp works (internal-sftp); LoginGraceTime 0 against CVE-2024-6387. Status in .kobo/ssh-status.txt. On this kernel sshd also needs 'Let sshd accept connections on kernel 2.6.35'. (firmware-performance-and-bugs.md §6)
      
      NEW: built from the Kobo Aura H2O analysis; not yet run on a device.
  - ReplaceText: {Find: "#HostKey /etc/ssh/ssh_host_rsa_key\n#HostKey /etc/ssh/ssh_host_ecdsa_key\n#HostKey /etc/ssh/ssh_host_ed25519_key\n", Replace: "# per-device keys made by /etc/init.d/ssh (the /etc/ssh/ssh_host_* keys are the same on every Kobo)\nHostKey /etc/ssh/device/ssh_host_ed25519_key\nHostKey /etc/ssh/device/ssh_host_ecdsa_key\nHostKey /etc/ssh/device/ssh_host_rsa_key\n"}
  - ReplaceText: {Find: "#LoginGraceTime 2m\n", Replace: "# 0 is the vendor-recommended mitigation for CVE-2024-6387 (OpenSSH 8.9p1 is affected)\nLoginGraceTime 0\n"}
  - ReplaceText: {Find: "#PermitRootLogin yes\n", Replace: "PermitRootLogin prohibit-password\n"}
  - ReplaceText: {Find: "AuthorizedKeysFile\t.ssh/authorized_keys\n", Replace: "AuthorizedKeysFile\t.ssh/authorized_keys /mnt/onboard/.kobo/ssh/authorized_keys\n"}
  - ReplaceText: {Find: "#PasswordAuthentication yes\n#PermitEmptyPasswords no\n", Replace: "PasswordAuthentication no\nPermitEmptyPasswords no\n"}
  - ReplaceText: {Find: "Subsystem\tsftp\t/usr/libexec/sftp-server\n", Replace: "Subsystem\tsftp\tinternal-sftp\n"}
  - ReplaceText: {Find: "Match User root\n\tForceCommand /etc/ssh/initial_ssh_setup.sh\nPermitRootLogin yes\nPermitEmptyPasswords yes\n", Replace: ""}
