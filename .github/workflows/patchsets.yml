name: patchsets

# Packs the patch sets in src/versions and publishes them on the rolling
# "patchsets" release, where kobopatcher downloads them from
# (https://github.com/kebasaa/kobopatcher/releases/download/patchsets/index.json).
# On pull requests the sets are only packed, to check that they still can be.

on:
  push:
    branches: [main]
    paths: ["src/versions/**", "src/kobopatcher/patchsets.py", "tools/publish_patchsets.py", ".github/workflows/patchsets.yml"]
  pull_request:
    paths: ["src/versions/**", "src/kobopatcher/patchsets.py", "tools/publish_patchsets.py", ".github/workflows/patchsets.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patchsets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install PyYAML
      - name: Pack the patch sets
        run: python tools/publish_patchsets.py --out dist/patchsets --commit "$GITHUB_SHA"
      - name: Publish on the patchsets release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view patchsets >/dev/null 2>&1; then
            gh release create patchsets --title "Patch sets" --latest=false \
              --notes "Patch sets that kobopatcher downloads. Updated automatically from src/versions on every change; don't edit by hand."
          fi
          # index.json last, so it never lists a zip that isn't there yet
          gh release upload patchsets dist/patchsets/*.zip --clobber
          gh release upload patchsets dist/patchsets/index.json --clobber
