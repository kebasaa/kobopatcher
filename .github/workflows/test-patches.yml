name: test-patches

# Applies every patch, one at a time, to the binaries in kobopatch-testdata:
# the latest kobopatch-patches release (like kobopatch's own CI) and
# kobopatcher's own patch sets in src/versions.

on:
  push:
    branches: [main]
    paths: ["src/**", "tools/test_patches.py", ".github/workflows/test-patches.yml"]
  pull_request:
    paths: ["src/**", "tools/test_patches.py", ".github/workflows/test-patches.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install .
      - name: Get kobopatch-patches (latest release)
        # gh uses the job's token; unauthenticated API calls get rate-limited (403)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo pgaskin/kobopatch-patches --json tagName -q .tagName)
          git clone --depth 1 --branch "$tag" https://github.com/pgaskin/kobopatch-patches.git patches
      - name: Cache kobopatch-testdata
        id: testdata
        uses: actions/cache@v4
        with:
          path: testdata
          key: kobopatch-testdata-v1
      - name: Get kobopatch-testdata
        if: steps.testdata.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch v1 https://github.com/pgaskin/kobopatch-testdata.git testdata && rm -rf testdata/.git
      - name: Test the kobopatch-patches release
        run: python tools/test_patches.py --patches patches --testdata testdata
      - name: Test kobopatcher's own patch sets
        run: python tools/test_patches.py --own src/versions --testdata testdata
